services:
  # MongoDB Config Server
  configSrv1:
    container_name: configSrv1
    image: mongo:latest
    command: ["--configsvr", "--replSet", "cfgrs", "--port", "27019", "--bind_ip", "0.0.0.0"]
    volumes:
      - cfgsvr1_data:/data/db

  # MongoDB Shard 1 with PRIMARY node
  shard1-1:
    container_name: shard1-1
    image: mongo:latest
    command: ["--shardsvr", "--replSet", "shard1", "--port", "27018", "--bind_ip", "0.0.0.0"]
    volumes:
      - shard1_data:/data/db

  # MongoDB Shard 2 with PRIMARY node
  shard2-1:
    container_name: shard2-1
    image: mongo:latest
    command: ["--shardsvr", "--replSet", "shard2", "--port", "27020", "--bind_ip", "0.0.0.0"]
    volumes:
      - shard2_data:/data/db

  # MongoDB mongos router
  mongos1:
    container_name: mongos1
    image: mongo:latest
    command: ["mongos", "--configdb", "cfgrs/configSrv1:27019", "--port", "27017", "--bind_ip", "0.0.0.0"]
    depends_on:
      - configSrv1
      - shard1-1
      - shard2-1
    ports:
      - 8080:8080

  pymongo_api:
    container_name: pymongo_api
    build:
      context: api_app
      dockerfile: Dockerfile
    depends_on:
      - mongos1
    ports:
      - 8081:8080
    environment:
      MONGODB_URL: "mongodb://mongos1:27017"
      MONGODB_DATABASE_NAME: "somedb"

volumes:
  cfgsvr1_data:
  shard1_data:
  shard2_data:
